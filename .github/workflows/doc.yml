name: Documentation
on:
  push: { branches: [ "master" ] }
  pull_request: { branches: [ "master" ] }

concurrency:
  group: doc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-manual:
    runs-on: ubuntu-24.04
    # github-pages-deploy-action pushes the rendered manual to the gh-pages
    # branch, which the default read-only GITHUB_TOKEN is not allowed to do.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with: { pixi-version: v0.81.0 }
      - name: build documentation
        run: |
          pixi run -e dev doc-build
          # Do not run Jekyll to create GitHub Pages but take HTML files as they are.
          touch doc/_build/html/.nojekyll
      - name: detect broken links
        run: pixi run -e dev doc-linkcheck
      - name: provide documentation as artifact
        uses: actions/upload-artifact@v7
        with:
          name: doc
          path: doc/_build/html
      - uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: doc/_build/html
          target-folder: docs
        if: ${{ github.event_name == 'push' }}
      - uses: flatsurf/actions/show-logs@main
        if: ${{ always() }}
